# Classic/FluentV9-to-Modern* (React) modernization drafts; all pairs remain unverified.
# Grammar: same OR to (+ optional values/scale) OR manual + targets OR drop + impact.
# to + transform: display-field (one literal column) or placeholder (authored target wins).
# text-input-mode: mapped Multiline -> Type; SingleLine drops; unless_present guards conflicts.
# value-record: literal single-column Items only; wrap text Default as a record block scalar.
# values may supply fallback_manual to classify unmatched formulas for review.
# transform requires fallback_manual; unsafe shapes remain precise review items.
# to: [A, B] splits the same formula to absent targets; authored corner overrides win.
# Pair add: block list of { property, value, basis, when? }; write only when absent.
# Pair open_items: block list of { property, reason, basis, when? }; report without guessing values.
# Optional when: single-column-items recognizes literal lists or Table records with only Value.
# Drop restore_default: true permits omission of a compatible target property to use its default.
# Drop unless_present: property list (block or [A,B]) + fallback_manual reason.
# Pair never_convert_when: ordered block list of { property, condition, reason, basis }.
# Conditions: present means authored, empty means absent/empty/="". First match always skips.
# field-report-2026-10-08#n records the modernizer field findings for this job.
# Every non-same entry requires basis. Catalog surfaces include augmentations.
# Evidence: inferred; catalog-name-match with explanation; field-report-2026-10-05#n
# and -followup#n only for applicable facts; studio-update-2026-10-06 for report §2;
# version-knowledge-<Type>@<version> for the catalog migration observations.
# Studio Update evidence concerns FluentV9 -> React, not classic -> React semantics.
# Gallery/Form/shapes/containers have no scoped modern counterpart.
