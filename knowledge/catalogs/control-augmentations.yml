# control-augmentations.yml — hand-curated overlay for the auto-extracted catalog
#
# WHY THIS FILE EXISTS
# The Canvas Authoring MCP's `describe_control` doesn't surface every property
# that PA-YAML actually accepts. This file captures what's missing AND records
# verification status — a tiered allow-list rather than a flat one.
#
# FOUR HAND-EDITABLE SECTIONS
#   augmentations:          — overlay ON TOP of extractor-reachable controls
#                             (notes, legacy variants, observed_variants,
#                             additional_input_properties).
#                             `observed_variants:` (schema_version 7+) is the
#                             dump-sourced lower-bound doctrine applied at VARIANT
#                             granularity: variant names current Studio still
#                             ACCEPTS but no longer EMITS, so no fresh export can
#                             evidence them. They WARN ('partial-catalog-data'),
#                             never REFUSE, and the control's properties are still
#                             validated normally. The block REQUIRES an
#                             `evidence:` map with verified_by: runtime_observation
#                             plus all four structured fields (claim_scope,
#                             environment, reproduction, falsifier) and a nonempty
#                             `variants:` list disjoint from both legacy_variants
#                             and the extractor's own variant list. Names here are
#                             NOT verified — the falsifier names the re-extraction
#                             that settles them.
#   dump_sourced_controls:  — entries added only for controls with extraction
#                             errors and retired as soon as extraction succeeds.
#                             An empty block means the extractor currently reaches
#                             everything. Recovered from a
#                             Studio-emitted PA-YAML export. Because Studio only emits
#                             NON-DEFAULT properties, these property lists are LOWER
#                             BOUNDS — incomplete by nature. The validator therefore
#                             treats unknown properties/variants on these controls as
#                             WARN ('partial-catalog-data'), never REFUSE: usage feeds
#                             the verification queue rather than blocking generation.
#                             Studio emission itself counts as verification
#                             (source: studio-export-<date>). RETIRE a dump_sourced
#                             entry the moment the extractor can reach the control —
#                             the build gate enforces this (no dup with the manifest).
#   synthetic_controls:     — PA-YAML authoring constructs that are not real
#                             Studio controls (described below).
#   version_knowledge:      — field-observed authored-version migrations. Each
#                             entry is a lower bound, never a general latest-version
#                             claim for control generations absent from this map.
#
# The validator's three-state behaviour:
#   PASS   — property is in auto-extracted catalog OR here with verified: true
#   WARN   — property is here with verified: false (default) — generation allowed,
#            warning emitted, usage tells you what to verify next
#   REFUSE — property is in neither — error: missing-catalog-entry
#
# Property entries support shorthand and longhand forms:
#   PropName: Number                                     — shorthand, implicit verified: false
#   PropName: { type: Number, verified: true,
#               verified_at: 2026-05-10, verified_by: compile_canvas }
# Optional longhand evidence fields are claim_scope, environment, reproduction,
# and falsifier. verified_by accepts compile_canvas, studio-export-YYYY-MM-DD,
# runtime_observation, and the deprecated one-release alias studio-observation.
# runtime_observation (including its legacy alias) requires all four evidence
# fields; other existing entries need no backfill.
#
# The extractor (cli/extractor.mjs) overwrites control-manifest.yml and
# control-properties.yml on every run. It NEVER touches this file. Hand-edit
# only. When verification rejects an entry, REMOVE it (not flag it false) —
# false-claim entries pollute the warn tier and erode trust in WARN.
#
# ─── Verification campaign 2026-05-10 ────────────────────────────────────
# 22 entries originally lifted from the year-old hand-curated catalog.
# Tested in batch via compile_canvas against a live tenant.
# Result: 4 verified, 18 rejected.
#
#   Verified (real MCP omissions, all on Gallery):
#     Gallery.OnSelect, Gallery.WrapCount, Gallery.TemplateFill,
#     Gallery.ItemAccessibleLabel
#
#   Rejected (manual catalog was wrong; auto-extractor was correct):
#     Camera.Brightness, Camera.Contrast, Camera.Zoom
#     Classic/CheckBox.Value
#     Classic/ComboBox.OnNavigate
#     Classic/Slider.ReadOnly
#     Classic/Toggle.RailFill, .RailHoverFill, .ValueFill, .ValueHoverFill
#     ComboBox.TextInputPlaceholder
#     DatePicker.DefaultDate
#     Icon.AccessibleLabel, Icon.BasePaletteColor
#     InfoButton.IconSize
#     Label.DelayOutput
#     Radio.OnSelect
#     Table.Size
#     TextInput.DelayOutput
#
# The augmentations layer is specifically about **Gallery** — `describe_control`
# misses 4 real Gallery properties. Everywhere else the MCP is correct and the
# year-old hand-curated catalog had stale or invented names. Worth knowing for
# future hand-augmentation: skepticism by default; verify before adding.

#   synthetic_controls:      — controls that have NO extractor representation and
#                             never will, because they are not real Studio controls
#                             but PA-YAML authoring constructs (e.g. CanvasComponent
#                             instances, whose real schema is the app-defined
#                             ComponentDefinition, not a fixed control). The
#                             extractor can't describe them, and a dump entry would
#                             be wrong too (their surface is the union of a small
#                             fixed frame + app-defined custom properties). They are
#                             folded into the generated catalog like dump_sourced,
#                             but carry `source: compile_canvas` and a
#                             `requires_sibling:` key (the sibling line that must
#                             accompany the Control:, e.g. ComponentName). Verified
#                             via compile_canvas round-trip. schema_version 4+.

schema_version: 7
sourced_from: retired hand-curated property table, filtered by verification 2026-05-10; dump_sourced_controls from studio-export-2026-07-08; synthetic_controls (CanvasComponent) verified 2026-07-19; version_knowledge from studio-export-2026-08-26
last_reviewed: 2026-09-20

# Field-verified Studio "update control versions" migrations, observed in
# before/after export pairs on 2026-08-26. This block is intentionally limited
# to those four observations; an authored key absent here remains unresolved.
version_knowledge:
  "Button@0.0.45":
    target_type: ModernButton
    target_version: "1.0.0"
    property_renames:
      - from: FontSize
        to: [Size]
      - from: BorderRadius
        to: [RadiusTopLeft, RadiusTopRight, RadiusBottomLeft, RadiusBottomRight]
    formula_rewrites:
      - from: "'ButtonCanvas.Appearance'.X"
        to: ButtonAppearance.X
    migration_note: "Studio: update control versions"
    evidence: studio-export-2026-08-26
    observed_at: "2026-08-26"
    lower_bound: true

