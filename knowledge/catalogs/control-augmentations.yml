# ─── Dump-sourced controls (studio-export-2026-07-08) ──────────────────────
# Controls with extraction errors (such as describe_control HTTP 500), recovered
# from a Studio PA-YAML export. Property lists are LOWER BOUNDS — Studio emits
# only non-default properties — so unknown props/variants WARN, never REFUSE.
# Property types are inferred from the emitted formula values (=RGBA(→Color,
# number→Number, =true/false→Boolean, ="..."→Text, On*→Event, real enum
# namespace→Enum, references/formulas→Unknown). Provenance record:
# catalogs/sources/studio-export-2026-07-08.yaml. Retire an entry once the
# extractor reaches the control (build gate enforces). An empty block is valid.
dump_sourced_controls:
  # Empty after the 2026-09-20 extraction reached all seven recovered controls.
  # Legacy data fields added subsequently from the provenance record:
  # catalogs/sources/studio-export-2026-09-20-legacy-datafields.yaml.
  # Current Studio does not emit these for new controls, but still emits them
  # in existing apps. Unknown properties/variants WARN: these are lower bounds.
  ComboBoxDataField:
    family: FluentV9
    variants: [textualColumn]
    source: studio-export-2026-09-20-legacy-datafields
    input_properties:
      FieldDisplayName: Text
      FieldName: Text
      FieldType: Text
      Order: Number

  TableDataField:
    family: Classic
    variants: [textualColumn]
    source: studio-export-2026-09-20-legacy-datafields
    input_properties:
      FieldDisplayName: Text
      FieldName: Text
      FieldType: Text
      Order: Number

# ─── Synthetic controls (schema_version 4+) ────────────────────────────────
# Authoring constructs that are NOT real Studio controls and have no extractor
# representation. CanvasComponent is an INSTANCE of an app-defined component; its
# true property surface is the component's ComponentDefinition (app-defined custom
# properties), not a fixed control schema. The validator therefore treats a
# CanvasComponent instance's non-frame properties as app-defined: they PASS when a
# matching ComponentDefinition is in the validated batch, else WARN
# ('component-custom-property'), never REFUSE. Only the small fixed frame below is
# a hard allow-list. `requires_sibling: ComponentName` records that a bare
# `Control: CanvasComponent` is invalid without a `ComponentName:` sibling
# (REFUSE 'component-name-required'). Verified via compile_canvas round-trip
# 2026-07-19. Build gate: a synthetic control must NOT exist in the manifest and
# MUST declare requires_sibling.
synthetic_controls:
  CanvasComponent:
    family: Synthetic
    source: compile_canvas
    verified: true
    verified_at: "2026-07-19"
    verified_by: compile_canvas
    requires_sibling: ComponentName
    input_properties:
      X: Number
      Y: Number
      Width: Number
      Height: Number
      Visible: Boolean
      DisplayMode: "@enum:DisplayMode"
