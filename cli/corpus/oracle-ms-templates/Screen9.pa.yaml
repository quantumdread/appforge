Screens:
  Screen9:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - TableScroll1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =24
            Width: =Parent.Width
          Children:
            - TopNav6:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 104, 56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width
                Children:
                  - TitleRow6:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =If(App.Width < 640, 16, 24)
                        PaddingRight: =If(App.Width < 640, 16, 24)
                        Width: =Parent.Width
                      Children:
                        - AppTitle6:
                            Control: ModernText
                            Properties:
                              FillPortions: =If(App.Width < 640, 1, 0)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =If(App.Width < 640, 13, 16)
                              Text: ="Contoso Art Studio"
                              Width: =If(App.Width < 640, 0, 200)
                        - NavTabsDesktop6:
                            Control: ModernTabList
                            Properties:
                              Appearance: =TabListAppearance.Subtle
                              BasePaletteColor: =RGBA(0, 65, 179, 1)
                              Default: |-
                                ={Value: "Home"}
                              FillPortions: =1
                              Height: =56
                              Items: =["Home", "Resources", "Events", "Gallery"]
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Visible: =App.Width >= 640
                        - IconChat6:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Message
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconShare6:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Share
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - IconSettings6:
                            Control: ModernIcon
                            Properties:
                              Height: =24
                              Icon: =Icon.Settings
                              IconColor: =RGBA(0, 0, 0, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - Avatar7:
                            Control: ModernAvatar
                            Properties:
                              Height: =32
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =32
                  - NavTabsMobile6:
                      Control: ModernTabList
                      Properties:
                        Appearance: =TabListAppearance.Subtle
                        BasePaletteColor: =RGBA(0, 65, 179, 1)
                        Default: |-
                          ={Value: "Home"}
                        Height: =If(App.Width < 640, 48, 0)
                        Items: |-
                          =Table({Value: "Home"}, {Value: "Resources"}, {Value: "Events"}, {Value: "Gallery"})
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =Parent.Width
            - NavDivider6:
                Control: ModernText
                Properties:
                  Fill: =RGBA(237, 237, 237, 1)
                  Height: =2
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =0
                  PaddingTop: =0
                  Text: =""
                  Width: =Parent.Width
            - TitleBand5:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 152, 128)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =12
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =32
                  Width: =Parent.Width
                Children:
                  - PageTitle4:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(App.Width < 640, 22, 28)
                        Text: ="Artwork registry"
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
                  - PageSubtitle4:
                      Control: ModernText
                      Properties:
                        AutoHeight: =true
                        Color: =RGBA(96, 94, 92, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(App.Width < 640, 12, 14)
                        Text: ="Track every submitted piece, its medium, and its review status."
                        Width: =Parent.Width - If(App.Width < 640, 32, 80)
            - FilterRow2:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =12
                  PaddingLeft: =If(App.Width < 640, 16, 40)
                  PaddingRight: =If(App.Width < 640, 16, 40)
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - FilterTabs2:
                      Control: ModernTabList
                      Properties:
                        Appearance: =TabListAppearance.FilledCircular
                        Default: |-
                          ={Value: "All"}
                        Height: =36
                        Items: =["All", "Active", "In review", "Draft"]
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =If(App.Width < 640, Parent.Width - 120, 420)
                  - FilterSpacer1:
                      Control: ModernText
                      Properties:
                        FillPortions: =1
                        Height: =36
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingTop: =0
                        Text: =""
                        Width: =0
                  - SearchInput1:
                      Control: ModernTextInput
                      Properties:
                        Height: =36
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Placeholder: ="Search"
                        Width: =If(App.Width < 640, 0, 200)
